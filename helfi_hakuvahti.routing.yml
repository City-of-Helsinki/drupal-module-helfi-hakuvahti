helfi_hakuvahti.settings:
  path: '/admin/tools/hakuvahti'
  defaults:
    _form: '\Drupal\helfi_hakuvahti\Form\SettingsForm'
    _title: 'Hakuvahti settings'
  requirements:
    _permission: 'administer site configuration'
  options:
    _admin_route: TRUE

helfi_hakuvahti.broadcast:
  path: '/admin/tools/hakuvahti/broadcast'
  defaults:
    _form: '\Drupal\helfi_hakuvahti\Form\BroadcastForm'
    _title: 'Send broadcast message'
  requirements:
    _permission: 'send hakuvahti broadcast'
  options:
    _admin_route: TRUE

helfi_hakuvahti.broadcast_status:
  path: '/admin/tools/hakuvahti/broadcast/{broadcast_id}'
  defaults:
    _controller: '\Drupal\helfi_hakuvahti\Controller\BroadcastStatusController::view'
    _title: 'Broadcast status'
  requirements:
    _permission: 'send hakuvahti broadcast'
    broadcast_id: '[0-9a-fA-F]{24}'
  options:
    _admin_route: TRUE

helfi_hakuvahti.subscribe:
  path: '/hakuvahti/subscribe'
  defaults:
    _controller: '\Drupal\helfi_hakuvahti\Controller\HakuvahtiSubscribeController::post'
  requirements:
    _permission: 'access content'

helfi_hakuvahti.confirm:
  path: '/hakuvahti/confirm'
  defaults:
    _controller: '\Drupal\helfi_hakuvahti\Controller\HakuvahtiController::confirm'
    _title_callback: '\Drupal\helfi_hakuvahti\Controller\HakuvahtiController::confirmTitle'
  requirements:
    _permission: 'access content'

helfi_hakuvahti.renew:
  path: '/hakuvahti/renew'
  defaults:
    _controller: '\Drupal\helfi_hakuvahti\Controller\HakuvahtiController::renew'
    _title_callback: '\Drupal\helfi_hakuvahti\Controller\HakuvahtiController::renewTitle'
  requirements:
    _permission: 'access content'

helfi_hakuvahti.unsubscribe:
  path: '/hakuvahti/unsubscribe'
  defaults:
    _controller: '\Drupal\helfi_hakuvahti\Controller\HakuvahtiController::unsubscribe'
    _title_callback: '\Drupal\helfi_hakuvahti\Controller\HakuvahtiController::unsubscribeTitle'
  requirements:
    _permission: 'access content'
